[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tps360"
version = "0.1.0"
description = "TPS360 core domain model"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tps360*"]

[tool.pytest.ini_options]
testpaths = ["src/tps360/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*.egg-info", ".pytest_cache", ".mypy_cache", ".ruff_cache", "__pycache__", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tps360"]
exclude = ["src/tps360/tests"]
